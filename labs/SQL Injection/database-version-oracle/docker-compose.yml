services:
  web:
    build: .
    container_name: oracle-version-lab
    ports:
      - "3000:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: oracle-version-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oracle_lab
